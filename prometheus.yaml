global:
  scrape_interval: 60s

scrape_configs:

  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ["cadvisor.cadvisor.svc.cluster.local:8080"]
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_service
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod
  - job_name: 'prod_cometcast_phpfpm'
    kubernetes_sd_configs:
        - role: endpoints
    relabel_configs:
      - source_labels: [ __meta_kubernetes_service_annotation_prod_cometcast_phpfpm_prometheus_io_scrape ]
        action: keep
        regex: true
      - source_labels: [ __meta_kubernetes_service_annotation_prod_cometcast_phpfpm_prometheus_scheme ]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels: [ __meta_kubernetes_service_annotation_prod_cometcast_phpfpm_prometheus_path ]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [ __address__, __meta_kubernetes_service_annotation_prod_cometcast_phpfpm_prometheus_port ]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_service
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod
